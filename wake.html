<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>吓哭了中转站</title>
    <style>
      :root {
        --bg: #f4f4f2;
        --ink: #1c1a17;
        --ink-2: #5c564e;
        --line: rgba(28, 26, 23, .12);
        --panel: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131110;
          --ink: #f0ebe3;
          --ink-2: #b8b0a4;
          --line: rgba(240, 235, 227, .14);
          --panel: rgba(255, 255, 255, .06);
        }
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 110px) 18px calc(40px + env(safe-area-inset-bottom));
        text-align: center;
      }
      main { width: 100%; max-width: 420px; }
      .light {
        width: 14px; height: 14px; border-radius: 50%; margin: 0 auto 20px;
        background: #0f9d58; animation: pulse 2.4s ease-out infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(61, 220, 151, .55); }
        70% { box-shadow: 0 0 0 12px rgba(61, 220, 151, 0); }
        100% { box-shadow: 0 0 0 0 rgba(61, 220, 151, 0); }
      }
      h1 {
        font-size: clamp(22px, 6vw, 30px);
        line-height: 1.4; margin: 0; font-weight: 700;
      }
      .status { margin-top: 20px; color: var(--ink-2); font-size: 15px; line-height: 1.8; }
      .bar {
        height: 6px; margin-top: 22px; border-radius: 99px;
        overflow: hidden; background: var(--line);
      }
      .bar i {
        display: block; height: 100%; width: 40%; border-radius: 99px;
        background: #6d4cff; animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      .actions { display: flex; gap: 12px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
      .actions a, .actions button {
        padding: 11px 20px; border-radius: 99px; font-size: 15px;
        border: 1px solid var(--line); background: var(--panel); color: var(--ink);
        text-decoration: none; cursor: pointer; font-family: inherit;
      }
      @media (prefers-reduced-motion: reduce) {
        .light, .bar i { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="light"></div>
      <h1>正在唤醒吓哭了中转站，请稍等</h1>
      <div class="status">
        <div id="hint">正在唤醒…</div>
        <div>已等待 <span id="elapsed">0</span> 秒 · 第 <span id="attempt">1</span> 次尝试</div>
      </div>
      <div class="bar"><i></i></div>
      <div class="actions">
        <a href="https://zz.299326.xyz">直接打开中转站</a>
        <button id="retry" type="button">再戳它一下</button>
      </div>
    </main>

    <script>
      (function () {
        var TARGET = "https://zz.299326.xyz";
        var STATUS_URL = "https://zz.299326.xyz/api/status";
        var FAVICON_URL = "https://zz.299326.xyz/favicon.ico";

        var awake = false;
        var polling = true;
        var attemptCount = 1;
        var elapsed = 0;
        var elapsedEl = document.getElementById("elapsed");
        var attemptEl = document.getElementById("attempt");
        var hintEl = document.getElementById("hint");

        setInterval(function () {
          if (polling && !awake) {
            elapsed += 1;
            elapsedEl.textContent = elapsed;
          }
        }, 1000);

        function timed(promise, ms) {
          return new Promise(function (resolve, reject) {
            var done = false;
            var t = setTimeout(function () {
              if (!done) { done = true; reject(new Error("timeout")); }
            }, ms);
            promise.then(function (v) {
              if (!done) { done = true; clearTimeout(t); resolve(v); }
            }, function (e) {
              if (!done) { done = true; clearTimeout(t); reject(e); }
            });
          });
        }

        function probeStatus() {
          return fetch(STATUS_URL + "?probe=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.json(); })
            .then(function (j) {
              if (j && j.success === true) return true;
              throw new Error("not ready");
            });
        }

        function probeFaviconFetch() {
          return fetch(FAVICON_URL + "?probe=" + Date.now(), { cache: "no-store" })
            .then(function (r) {
              if (r && r.status === 200) return true;
              throw new Error("not ready");
            });
        }

        function probeFaviconImage() {
          return new Promise(function (resolve, reject) {
            var img = new Image();
            img.onload = function () { resolve(true); };
            img.onerror = function () { reject(new Error("not ready")); };
            img.src = FAVICON_URL + "?probe=" + Date.now();
          });
        }

        function anyProbe() {
          var probes = [probeStatus(), probeFaviconFetch(), probeFaviconImage()].map(function (p) {
            return timed(p, 12000);
          });
          if (typeof Promise.any === "function") return Promise.any(probes);
          return new Promise(function (resolve, reject) {
            var left = probes.length;
            probes.forEach(function (p) {
              p.then(resolve, function () {
                left -= 1;
                if (left === 0) reject(new Error("all failed"));
              });
            });
          });
        }

        function onAwake() {
          if (awake) return;
          awake = true;
          polling = false;
          hintEl.textContent = "醒了，正在跳转…";
          setTimeout(function () {
            window.location.replace(TARGET + "/");
          }, 800);
        }

        function attempt() {
          if (!polling || awake) return;
          attemptEl.textContent = attemptCount;
          anyProbe().then(onAwake, function () {
            if (polling && !awake) {
              attemptCount += 1;
              setTimeout(attempt, 3500);
            }
          });
        }

        document.getElementById("retry").addEventListener("click", function () {
          if (awake) return;
          elapsed = 0;
          elapsedEl.textContent = 0;
          hintEl.textContent = "又戳了它一下";
          attempt();
        });

        attempt();
      })();
    </script>
  </body>
</html>
