<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>锈蚀死域社区</title>
<meta name="description" id="metaDescription" content="锈蚀死域社区 —— 硬核废土生存" />
<link rel="icon" id="faviconLink" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0f18'/%3E%3Cpath d='M9 22 L16 8 L23 22 Z' fill='none' stroke='%2338bdf8' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/assets/style.css" />
<style>
  /* 兜底：即使 <body> 尚未解析（例如外部脚本阻塞了解析），也保持深色底，避免纯白页面 */
  html { background: #05070c; }
  html.xsdz-slow::before {
    content: "锈蚀死域 · 载入中";
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: #05070c;
    color: rgba(140, 170, 205, .55);
    font: 500 12.5px/1.6 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .32em;
    z-index: 2147483600;
    pointer-events: none;
  }
  html.xsdz-ready::before { display: none; }
</style>
<script>
(function () {
  var el = document.documentElement;
  var timer = setTimeout(function () { el.classList.add('xsdz-slow'); }, 400);
  var done = function () { clearTimeout(timer); el.classList.add('xsdz-ready'); };
  if (document.readyState !== 'loading') { done(); }
  else {
    document.addEventListener('DOMContentLoaded', done);
    window.addEventListener('load', done);
  }
})();
</script>
</head>
<body>

<!-- 背景层 -->
<div class="bg-layer" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-glow glow-a"></div>
  <div class="bg-glow glow-b"></div>
  <div class="bg-scan"></div>
  <div class="bg-noise"></div>
</div>
<div class="cursor-spot" aria-hidden="true"></div>

<!-- 顶部导航 -->
<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="brand" href="#home">
      <img class="brand-img" id="brandImg" alt="" hidden />
      <span class="brand-mark" id="brandMark">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <path d="M9 23 L16 7 L23 23 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M12.6 18.4 h6.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text" id="brandText">锈蚀死域</span>
    </a>
    <nav class="nav-links" id="navLinks"></nav>
    <a class="btn btn-ghost nav-cta" id="navCta" href="#download">下载客户端</a>
    <button class="nav-burger" id="navBurger" aria-label="菜单">
      <span></span><span></span>
    </button>
  </div>
</header>

<main>

  <!-- Hero -->
  <section class="hero" id="home">
    <div class="hero-inner">
      <div class="hero-copy">
        <div class="badge" id="heroBadge">
          <span class="badge-dot"></span><span id="heroBadgeText">加载中…</span>
        </div>
        <h1 class="hero-title">
          <span id="heroTitleTop">锈蚀死域</span><span class="grad" id="heroTitleBottom">社区</span>
        </h1>
        <p class="hero-sub" id="heroSub"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" id="heroPrimary" href="#download">
            <span id="heroPrimaryText">立即下载</span>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <a class="btn btn-ghost" id="heroSecondary" href="#download"><span id="heroSecondaryText">查看更新日志</span></a>
        </div>
        <div class="hero-stats" id="heroStats"></div>
      </div>

      <div class="hero-visual">
        <div class="terminal" id="terminal">
          <div class="terminal-bar">
            <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            <span class="terminal-title" id="terminalTitle">xsdz-launcher</span>
          </div>
          <div class="terminal-body" id="terminalBody"></div>
        </div>
        <div class="hero-card" id="heroCard">
          <img id="heroCardImg" alt="" hidden />
          <div class="hero-card-fallback" id="heroCardFallback">
            <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
              <defs>
                <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="var(--accent)"/>
                  <stop offset="1" stop-color="var(--accent-2)"/>
                </linearGradient>
              </defs>
              <circle cx="60" cy="60" r="46" fill="none" stroke="url(#hg)" stroke-width="1.2" opacity=".5"/>
              <circle cx="60" cy="60" r="34" fill="none" stroke="url(#hg)" stroke-width="1.2" opacity=".35"/>
              <path d="M36 78 L60 26 L84 78 Z" fill="none" stroke="url(#hg)" stroke-width="2.6" stroke-linejoin="round"/>
              <path d="M48 66 h24" stroke="url(#hg)" stroke-width="2.6" stroke-linecap="round"/>
            </svg>
            <p>RUSTY DEADZONE</p>
            <em class="hero-card-hint">主视觉图位 · 后台「首屏 Hero → 右侧主视觉图片」可替换</em>
          </div>
        </div>
      </div>
    </div>
    <div class="hero-marquee"><div class="marquee-track" id="marqueeTrack"></div></div>
  </section>

  <!-- 特性 -->
  <section class="section" id="features">
    <div class="section-head">
      <span class="eyebrow" id="featuresEyebrow">CORE FEATURES</span>
      <h2 class="section-title" id="featuresTitle">为硬核而生</h2>
      <p class="section-sub" id="featuresSub"></p>
    </div>
    <div class="feature-grid" id="featureGrid"></div>
  </section>

  <!-- 图集 -->
  <section class="section" id="gallery">
    <div class="section-head">
      <span class="eyebrow" id="galleryEyebrow">SCREENSHOTS</span>
      <h2 class="section-title" id="galleryTitle">锈蚀世界</h2>
      <p class="section-sub" id="gallerySub"></p>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- 下载 -->
  <section class="section section-download" id="download">
    <div class="download-panel">
      <div class="download-head">
        <div>
          <span class="eyebrow" id="downloadEyebrow">DOWNLOAD</span>
          <h2 class="section-title" id="downloadTitle">获取锈蚀死域</h2>
          <p class="section-sub" id="downloadSub"></p>
        </div>
        <div class="version-box">
          <div class="version-row"><span>最新版本</span><strong id="dlVersion">v3.2.0</strong></div>
          <div class="version-row"><span>安装包大小</span><strong id="dlSize">4.86 GB</strong></div>
          <div class="version-row"><span>更新时间</span><strong id="dlUpdated">2026-10-01</strong></div>
          <div class="version-row"><span>校验</span><strong class="mono" id="dlHash">SHA-256</strong></div>
        </div>
      </div>
      <div class="platform-grid" id="platformGrid"></div>
      <div class="mirror-row">
        <span class="mirror-label">镜像线路</span>
        <div class="mirror-list" id="mirrorList"></div>
      </div>
      <p class="download-note" id="downloadNote"></p>
    </div>
  </section>

  <!-- 关于 -->
  <section class="section" id="about">
    <div class="about-grid">
      <div class="about-copy">
        <span class="eyebrow" id="aboutEyebrow">ABOUT US</span>
        <h2 class="section-title" id="aboutTitle">关于锈蚀死域社区</h2>
        <div id="aboutParagraphs"></div>
      </div>
      <div class="about-points" id="aboutPoints"></div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="brand-mark small">
        <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true">
          <path d="M9 23 L16 7 L23 23 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
        </svg>
      </span>
      <span id="footerBrandText">锈蚀死域社区</span>
    </div>
    <div class="footer-links" id="footerLinks"></div>
    <div class="footer-copy" id="footerCopy"></div>
    <div class="footer-icp" id="footerIcp"></div>
  </div>
</footer>

<script src="/assets/app.js"></script>
</body>
</html>
